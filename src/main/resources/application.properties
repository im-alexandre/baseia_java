spring.application.name=java-ai-lab
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5.4-mini

# Proxy HTTP para OpenAI/OpenRouter; loopback continua com acesso direto.
baseia.http.proxy.enabled=${BASEIA_HTTP_PROXY_ENABLED:true}
baseia.http.proxy.host=${BASEIA_HTTP_PROXY_HOST:localhost}
baseia.http.proxy.port=${BASEIA_HTTP_PROXY_PORT:18080}

# Qdrant
baseia.qdrant.vector-name=dense
baseia.qdrant.url=http://localhost:6335
baseia.qdrant.collection=gestao_patrimonial_poc_qwen3_4b_q8_v1
spring.ai.vectorstore.qdrant.host=127.0.0.1
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=gestao_patrimonial_poc_qwen3_4b_q8_v1
spring.ai.vectorstore.qdrant.initialize-schema=false

# Embeddings: OpenRouter (Qwen3 4B, 2560 dimensoes)
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.openai.embedding.base-url=https://openrouter.ai/api/v1
spring.ai.openai.embedding.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.embedding.model=qwen/qwen3-embedding-4b
spring.ai.openai.embedding.dimensions=2560
spring.ai.openai.embedding.encoding-format=float
