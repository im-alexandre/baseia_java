spring.application.name=baseia-java

# O preparo não precisa de modelo; habilitar embeddings apenas ao indexar.
spring.ai.model.chat=none
spring.ai.model.embedding=${SPRING_AI_MODEL_EMBEDDING:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.embedding.model=${BASEIA_EMBEDDING_MODEL:text-embedding-3-small}

baseia.qdrant.url=${BASEIA_QDRANT_URL:http://localhost:6333}
baseia.qdrant.collection=${BASEIA_QDRANT_COLLECTION:normas_v1}
baseia.qdrant.vector-name=${BASEIA_QDRANT_VECTOR_NAME:dense}

# Mantém a opção de proxy apenas para download de legislação.
baseia.http.proxy.enabled=${BASEIA_HTTP_PROXY_ENABLED:false}
baseia.http.proxy.host=${BASEIA_HTTP_PROXY_HOST:localhost}
baseia.http.proxy.port=${BASEIA_HTTP_PROXY_PORT:18080}
